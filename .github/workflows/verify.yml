name: Verify OrcaSynapse

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not stock postgres: the migrator creates the vector
        # extension and the baseline declares a vector column, so a plain image
        # cannot apply migrations at all.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: orcasynapse_test
          POSTGRES_USER: orcasynapse_test
          POSTGRES_PASSWORD: orcasynapse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orcasynapse_test -d orcasynapse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate installer scripts
        run: bash -n install.sh scripts/*.sh scripts/lib/*.sh
      - name: Static release and deployment consistency
        run: |
          bash scripts/sync-installer-ui.sh --check
          bash scripts/test-docker-build-closure.sh
          bash scripts/test-release-consistency.sh
      - name: Verify installer recovery paths
        run: |
          bash scripts/test-public-installer-recovery.sh
          bash scripts/test-agentic-installer-recovery.sh
      # The recovery tests source the installer and exercise functions in
      # isolation; main() itself had never been run by anything, so a break in
      # the install sequence reached a customer's VM first. The runner is a full
      # Ubuntu VM with systemd and Docker, which is all this needs.
      - name: Run the Agentic System installer end to end
        run: sudo bash scripts/test-agentic-installer-smoke.sh
      - name: Verify Linux container secret access
        run: sudo bash scripts/test-installer-secret-permissions.sh
      - run: pnpm install --frozen-lockfile
      # Declared in package.json since the first release but never wired here,
      # so four high-severity advisories in shipped dependencies went unnoticed
      # until ai-v1.34.0. Blocking: a high in a production dependency is a
      # release decision, not a warning to scroll past.
      - name: Audit production dependencies
        run: pnpm security:audit
      - run: pnpm verify
        # Data-layer tests provision an isolated database per file rather than
        # faking Drizzle's query builder, so the suite needs a live server.
        env:
          ORCASYNAPSE_TEST_DATABASE_URL: postgresql://orcasynapse_test:orcasynapse_test@127.0.0.1:5432/postgres
      - run: pnpm verify:postgres
        env:
          ORCASYNAPSE_INTEGRATION_DATABASE_URL: postgresql://orcasynapse_test:orcasynapse_test@127.0.0.1:5432/orcasynapse_test
      # After the build, because it reads apps/web/dist. The container serves
      # style-src 'self' and the dev server sends no CSP header at all, so this
      # class of break is invisible until it reaches the pilot.
      - name: Verify CSP closure of the built dashboard
        run: bash scripts/test-csp-closure.sh

  install:
    runs-on: ubuntu-latest
    # Supersedes the old compose-build job. That one built the images against
    # placeholder secrets and stopped there; this runs the installer a customer
    # actually runs -- real secrets, migrations, services, and a control plane
    # that answers -- for the same dominant cost, the image build.
    #
    # Still advisory, matching the posture compose-build had. Promote to
    # required once consistently green; that is a policy call, not a test one.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install a fresh control plane end to end
        run: sudo bash scripts/test-orcasynapse-installer-smoke.sh
