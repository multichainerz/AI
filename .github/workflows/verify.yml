name: Verify OrcaSynapse

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: orcasynapse_test
          POSTGRES_USER: orcasynapse_test
          POSTGRES_PASSWORD: orcasynapse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orcasynapse_test -d orcasynapse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The installer parse check, the eol=lf attribute assertion, both sync
      # `--check`s, the Dockerfile copy closure and the release version surfaces
      # -- one script rather than four steps, because `pnpm verify` runs the
      # same script. They were inline here for several releases, which is what
      # let `pnpm verify` cover none of them while CONTRIBUTING called it the
      # merge gate: a release commit goes straight to `main`, so the
      # `pull_request` trigger never fires for it and the `push` run reports
      # after the tag is public.
      #
      # Still before `pnpm install`, which is the reason this is a separate step
      # from `pnpm verify` below rather than only reached through it: every gate
      # in it needs bash, git and node and nothing else, so it can fail in
      # seconds instead of after a dependency install and a build.
      - name: Static conformance
        run: bash scripts/test-static-conformance.sh
      - name: Hermes corpus reconciler safety
        # Root is required to exercise the real VM2 root-to-Hermes credential
        # transition; the test still confines all fixtures to a temporary tree.
        run: sudo python3 scripts/test-hermes-corpus-reconciler.py
      # Guards the ceilings that keep the worker's ~2 GB of model weights from
      # handing the host OOM killer a choice, the bind address that makes a host
      # firewall rule on the dashboard port effective, and -- since a `cpus:`
      # ceiling that a runner happens to satisfy is a ceiling a customer's
      # smaller VM does not -- that CPU is never expressed as a host-size
      # assumption. Lives in a script rather than inline so the rule can be run
      # and changed with proof, instead of only on a pull request.
      - name: Deployment limits and exposure
        run: |
          node scripts/test-deployment-limits.mjs
          # The same guard again with an operator-style override exported.
          # compose.yaml invites exactly this tuning and `docker compose config`
          # resolves it, so a guard that reads the caller's environment reports
          # on that operator's host rather than on the repository: it invented
          # failures for developers with a variable set, and it would equally
          # have hidden a bad shipped default behind a good local override. The
          # two runs must agree.
          ORCASYNAPSE_WORKER_CPU_SHARES=2048 node scripts/test-deployment-limits.mjs
      - name: Verify installer recovery paths
        run: |
          bash scripts/test-public-installer-recovery.sh
          bash scripts/test-agentic-installer-recovery.sh
      # Sources install-orcasynapse.sh and runs its real preflight with the host
      # CPU count faked in both directions. The alternative to a preflight is an
      # operator learning the floor from a half-created stack, which is exactly
      # what the compose CPU ceilings used to produce.
      - name: Verify the installer's host-sizing preflight
        run: bash scripts/test-installer-host-sizing.sh
      # Runs both scripts' main() through a real sudo with docker stubbed, which
      # is the only way to see the boundary that made the public-scheme
      # declaration unreachable: sudoers is env_reset, so the variable an
      # operator exported never arrived and a TLS deployment installed itself on
      # http. Also proves the break-glass rotation cannot return a recorded
      # https installation to http.
      - name: Verify the public-scheme declaration survives sudo
        run: bash scripts/test-installer-public-scheme.sh
      # The recovery tests source the installer and exercise functions in
      # isolation; main() itself had never been run by anything, so a break in
      # the install sequence reached a customer's VM first. The runner is a full
      # Ubuntu VM with systemd and Docker, which is all this needs.
      - name: Run the Agentic System installer end to end
        run: sudo bash scripts/test-agentic-installer-smoke.sh
      - name: Verify Linux container secret access
        run: sudo bash scripts/test-installer-secret-permissions.sh
      - run: pnpm install --frozen-lockfile
      # Declared in package.json since the first release but never wired here,
      # so four high-severity advisories in shipped dependencies went unnoticed
      # until v0.6.0. Blocking: a high in a production dependency is a
      # release decision, not a warning to scroll past.
      - name: Audit production dependencies
        run: pnpm security:audit
      # Static conformance again (seconds, and it is what the script promises),
      # then the database timeout-budget guard, the build, typecheck, suite,
      # migration check, and the CSP closure of the dashboard it just built.
      #
      # The budget guard runs before the suite rather than after, because the
      # failure it prevents is a flake: a database-backed test in a package that
      # never declared the timeout profile passes on an idle machine and times
      # out at 5000ms under the concurrency of `pnpm -r test`. The CSP check
      # runs after the build because it reads apps/web/dist -- the container
      # serves style-src 'self' and the dev server sends no CSP header at all,
      # so that class of break is invisible until it reaches the pilot.
      - run: pnpm verify
        # Data-layer tests provision an isolated database per file rather than
        # faking Drizzle's query builder, so the suite needs a live server.
        env:
          ORCASYNAPSE_TEST_DATABASE_URL: postgresql://orcasynapse_test:orcasynapse_test@127.0.0.1:5432/postgres
      - run: pnpm verify:postgres
        env:
          ORCASYNAPSE_INTEGRATION_DATABASE_URL: postgresql://orcasynapse_test:orcasynapse_test@127.0.0.1:5432/orcasynapse_test

  install:
    runs-on: ubuntu-latest
    # Supersedes the old compose-build job. That one built the images against
    # placeholder secrets and stopped there; this runs the installer a customer
    # actually runs -- real secrets, migrations, services, and a control plane
    # that answers -- for the same dominant cost, the image build.
    #
    # Blocking, and it is the only job that is. `verify` proves nothing about
    # the deployment: test-docker-build-closure.sh greps the Dockerfiles for
    # COPY lines without invoking a builder, so a Dockerfile that cannot build,
    # a compose.yaml that cannot come up, or an install-orcasynapse.sh that
    # fails halfway all merged green. The inverse was stranger still -- the VM2
    # installer smoke test above already blocked, while this one, the script a
    # customer runs first, did not.
    #
    # It costs no wall clock to require: this job has no `needs`, so it runs
    # beside `verify` rather than after it, and the image build it is dominated
    # by is shorter than that job's install-build-test sequence. The timeout is
    # what keeps a required job from parking a pull request for the six-hour
    # default if the installer's readiness wait never returns.
    #
    # Requiring it only became safe once compose.yaml stopped sizing services in
    # whole CPUs. A standard runner is four vCPU on a public repository and two
    # on a private one, and the `worker` ceiling was four: green here with no
    # margin at all, blocking every pull request the moment this repository
    # turns private or the fleet is resized, while already failing outright on
    # the two vCPU customer VMs it was meant to protect. Weights have no such
    # boundary, so runner width no longer decides whether a change can merge.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install a fresh control plane end to end
        run: sudo bash scripts/test-orcasynapse-installer-smoke.sh
