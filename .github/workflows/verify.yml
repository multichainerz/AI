name: Verify AIHub

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aihub_test
          POSTGRES_USER: aihub_test
          POSTGRES_PASSWORD: aihub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aihub_test -d aihub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm verify:postgres
        env:
          AIHUB_INTEGRATION_DATABASE_URL: postgresql://aihub_test:aihub_test@127.0.0.1:5432/aihub_test
