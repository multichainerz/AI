name: Verify OrcaSynapse

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not stock postgres: the migrator creates the vector
        # extension and the baseline declares a vector column, so a plain image
        # cannot apply migrations at all.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: orcasynapse_test
          POSTGRES_USER: orcasynapse_test
          POSTGRES_PASSWORD: orcasynapse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orcasynapse_test -d orcasynapse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer scripts
        run: bash -n install.sh scripts/*.sh scripts/lib/*.sh
      - name: Static release and deployment consistency
        run: |
          bash scripts/sync-installer-ui.sh --check
          bash scripts/test-docker-build-closure.sh
          bash scripts/test-release-consistency.sh
      - name: Verify installer recovery paths
        run: |
          bash scripts/test-public-installer-recovery.sh
          bash scripts/test-agentic-installer-recovery.sh
      - name: Verify Linux container secret access
        run: sudo bash scripts/test-installer-secret-permissions.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Declared in package.json since the first release but never wired here,
      # so four high-severity advisories in shipped dependencies went unnoticed
      # until v0.6.0. Blocking: a high in a production dependency is a
      # release decision, not a warning to scroll past.
      - name: Audit production dependencies
        run: pnpm security:audit
      - run: pnpm verify
        # Data-layer tests provision an isolated database per file rather than
        # faking Drizzle's query builder, so the suite needs a live server.
        env:
          ORCASYNAPSE_TEST_DATABASE_URL: postgresql://orcasynapse_test:orcasynapse_test@127.0.0.1:5432/postgres
      - run: pnpm verify:postgres
        env:
          ORCASYNAPSE_INTEGRATION_DATABASE_URL: postgresql://orcasynapse_test:orcasynapse_test@127.0.0.1:5432/orcasynapse_test

  compose-build:
    runs-on: ubuntu-latest
    # Non-blocking full-image proof: the static closure and consistency checks
    # in `verify` already gate the known regression classes cheaply. Promote to
    # required once consistently green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Provide placeholder secret files for compose interpolation
        run: |
          mkdir -p .local/secrets
          for name in postgres_password orcasynapse_database_url orcasynapse_master_key orcasynapse_installation_key; do
            printf 'placeholder' > ".local/secrets/${name}"
          done
      - name: Build the compose stack images
        run: docker compose build
