# X-Forwarded-Proto is an operator-declared constant, never anything the client
# sent. The API runs with trustProxy, so whatever arrives here as
# X-Forwarded-Proto becomes request.protocol, and request.protocol is what
# decides whether the administrator and enterprise session cookies carry Secure:
# honour the inbound value and any client could hand itself that decision.
#
# Reporting $scheme instead is wrong in the other direction. This server listens
# on plain HTTP, so $scheme is always http, and behind the upstream TLS
# terminator deploy/BOOTSTRAP.md requires, the cookie would then never carry
# Secure on exactly the deployments that do terminate TLS.
#
# ORCASYNAPSE_PUBLIC_SCHEME is the operator's declaration of the scheme browsers
# really use. Dockerfile.web installs this file as an envsubst template and pins
# the default to http, because envsubst leaves the placeholder in place when the
# variable is unset and nginx then refuses to start on an unknown variable. The
# map re-checks the rendered value so a typo costs the Secure attribute instead
# of asserting TLS that is not there.
#
# The map output must not be named after the environment variable: nginx
# lowercases variable names, so $orcasynapse_public_scheme would be the same
# variable as the ${ORCASYNAPSE_PUBLIC_SCHEME} placeholder, and an unset
# variable would quietly leave the map feeding on itself instead of failing.
map "${ORCASYNAPSE_PUBLIC_SCHEME}" $orcasynapse_forwarded_proto {
    default   http;
    ~*^https$ https;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr, not $proxy_add_x_forwarded_for: this proxy reports the
        # peer it actually talked to and drops whatever chain the client offered,
        # so audit metadata cannot be dictated by the request either.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $orcasynapse_forwarded_proto;
        proxy_buffering off;
    }

    location /internal/v1/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $orcasynapse_forwarded_proto;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://api:4000/healthz;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://api:4000/readyz;
        proxy_set_header Host $host;
    }

    location = /web-healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /install/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $orcasynapse_forwarded_proto;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
