# X-Forwarded-Proto is an operator-declared constant, never anything the client
# sent. The API runs with trustProxy, so whatever arrives here as
# X-Forwarded-Proto becomes request.protocol, and request.protocol is what
# decides whether the administrator and enterprise session cookies carry Secure:
# honour the inbound value and any client could hand itself that decision.
#
# Reporting $scheme instead is wrong in the other direction. This server listens
# on plain HTTP, so $scheme is always http, and behind the upstream TLS
# terminator deploy/BOOTSTRAP.md requires, the cookie would then never carry
# Secure on exactly the deployments that do terminate TLS.
#
# ORCASYNAPSE_PUBLIC_SCHEME is the operator's declaration of the scheme browsers
# really use. Dockerfile.web installs this file as an envsubst template and pins
# the default to http, because envsubst leaves the placeholder in place when the
# variable is unset and nginx then refuses to start on an unknown variable. The
# map re-checks the rendered value so a typo costs the Secure attribute instead
# of asserting TLS that is not there.
#
# The map output must not be named after the environment variable: nginx
# lowercases variable names, so $orcasynapse_public_scheme would be the same
# variable as the ${ORCASYNAPSE_PUBLIC_SCHEME} placeholder, and an unset
# variable would quietly leave the map feeding on itself instead of failing.
map "${ORCASYNAPSE_PUBLIC_SCHEME}" $orcasynapse_forwarded_proto {
    default   http;
    ~*^https$ https;
}

# The two unauthenticated sign-in routes, and the only rate limit in the stack.
#
# Both of them verify a password with scrypt at OWASP's recommended minimum --
# 128 MiB and about 790ms measured on this hardware -- and both do it inside a
# database transaction. The pool has no `max`, so pg-pool's default of ten
# applies: ten concurrent posts hold every pool client for the length of a hash
# and the deployment drains at under four sign-ins a second, which blocks every
# other database-backed route including /readyz, the api container's own
# healthcheck.
#
# The per-account lockout is no help in either direction, because the hash runs
# before the lockout is consulted: an unknown username never locks, and a
# username already locked out still pays for a full hash. So the cost is
# unauthenticated and unbounded, and nothing in the API limits it -- there is no
# rate-limit plugin in apps/api.
#
# Six a minute with a small burst is far above any human sign-in rate and far
# below the concurrency that empties the pool. Keyed on $binary_remote_addr,
# which behind the documented upstream terminator is that proxy -- deliberately:
# the limit is there to protect the pool, and a limit an attacker could spread
# across forged addresses would not.
#
# SECURITY.md declares denial of service against your own deployment out of
# scope, so this is defence rather than an advertised guarantee. It costs one
# shared zone.
limit_req_zone $binary_remote_addr zone=orcasynapse_signin:1m rate=6r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;

    # Ahead of `location /api/` because a prefix match here must win over it.
    # Both carry the same proxy configuration as the general block; only the
    # limit differs. `burst=3 nodelay` lets a person who mistypes their password
    # twice retry immediately and queues nothing -- a delayed queue would hold
    # nginx workers open for exactly the flood this is meant to shed.
    location = /api/v1/auth/local/login {
        limit_req zone=orcasynapse_signin burst=3 nodelay;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $orcasynapse_forwarded_proto;
        proxy_buffering off;
    }

    location = /api/v1/admin/session/local {
        limit_req zone=orcasynapse_signin burst=3 nodelay;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $orcasynapse_forwarded_proto;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr, not $proxy_add_x_forwarded_for: this proxy reports the
        # peer it actually talked to and drops whatever chain the client offered,
        # so audit metadata cannot be dictated by the request either.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $orcasynapse_forwarded_proto;
        proxy_buffering off;
        # Fastify raises artifact/corpus uploads to 6 MiB JSON. Nginx's default
        # 1m is the tighter ceiling on the production path and 413s a 4 MiB
        # composer attachment before the API sees it.
        client_max_body_size 8m;
    }

    location /internal/v1/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $orcasynapse_forwarded_proto;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
        # Hermes replays session history, including data:image parts, through
        # this location. Fastify's route ceiling is 16 MiB; leave Nginx at
        # least that high so the proxy is not the silent 413.
        client_max_body_size 16m;
    }

    location = /healthz {
        proxy_pass http://api:4000/healthz;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://api:4000/readyz;
        proxy_set_header Host $host;
    }

    location = /web-healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /install/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $orcasynapse_forwarded_proto;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
