map $http_x_forwarded_proto $orcasynapse_forwarded_proto {
    default $scheme;
    ~*^https$ https;
    ~*^http$ http;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;

    location /api/ {
        # Matches MAX_UPLOAD_BYTES in apps/api/src/documents/routes.ts. nginx
        # defaults to 1m, so document upload -- the product's core feature --
        # returned 413 for anything larger behind the container while working
        # fine under the Vite dev proxy, which has no limit. Raise both or
        # neither: a cap here below the API's turns a clean 413 from the API
        # into an opaque one from the proxy.
        client_max_body_size 50m;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $orcasynapse_forwarded_proto;
        proxy_buffering off;
    }

    location /internal/v1/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $orcasynapse_forwarded_proto;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://api:4000/healthz;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://api:4000/readyz;
        proxy_set_header Host $host;
    }

    location = /web-healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /install/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $orcasynapse_forwarded_proto;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
