name: orcasynapse

services:
  postgres:
    # pgvector, not stock postgres: the migrator creates the vector extension
    # and the baseline declares vector columns, so a plain image cannot apply
    # migrations at all. Must stay identical to the CI service image.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: orcasynapse
      POSTGRES_USER: orcasynapse
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcasynapse -d orcasynapse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - orcasynapse_database_url
    command:
      - "node"
      - "packages/database/dist/drizzle/migrate-cli.js"
    networks:
      - data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    secrets:
      - orcasynapse_database_url
      - orcasynapse_master_key
      - orcasynapse_installation_key
    networks:
      - application
      - data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      # Only the worker embeds. The transformers cache defaults inside
      # node_modules, which this image makes unwritable by running as a
      # non-root user, so it is pointed at a mounted volume: the first
      # embedding then succeeds and the ~2 GB of BGE-M3 weights survive a
      # restart instead of being re-downloaded.
      ORCASYNAPSE_MODEL_CACHE_DIR: /var/lib/orcasynapse/models
    volumes:
      - model_cache:/var/lib/orcasynapse/models
    depends_on:
      migrate:
        condition: service_completed_successfully
    secrets:
      - orcasynapse_database_url
      - orcasynapse_master_key
    networks:
      - application
      - data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ORCASYNAPSE_HTTP_PORT:-8080}:8080"
    networks:
      - application
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/web-healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

secrets:
  postgres_password:
    file: ./.local/secrets/postgres_password
  orcasynapse_database_url:
    file: ./.local/secrets/orcasynapse_database_url
  orcasynapse_master_key:
    file: ./.local/secrets/orcasynapse_master_key
  orcasynapse_installation_key:
    file: ./.local/secrets/orcasynapse_installation_key

volumes:
  postgres_data:
  model_cache:

networks:
  application:
  data:
    internal: true
